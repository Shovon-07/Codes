<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link rel="shortcut icon" href="./img/Vu logo.jpg" type="image/x-icon" />
    <title>Vu Navigation</title>
  </head>

  <body>
    <h2>Varandra Campus Map</h2>
    <div class="map-container">
      <svg viewBox="0 0 800 500">
        <!-- Roads / Edges -->
        <g id="roads">
          <!-- Main gate to gate 2 -->
          <line id="edge-0-1" class="road" x1="50" y1="450" x2="400" y2="450" />
          <line
            id="edge-0-2"
            class="road"
            x1="400"
            y1="450"
            x2="750"
            y2="450"
          />
          <line id="edge-1-3" class="road" x1="50" y1="350" x2="50" y2="450" />
          <path
            id="edge-0-3"
            class="road"
            d="M 400 450
                L 400 400
                Q 400 380 380 380
                L 50 350"
          />
          <path
            id="edge-2-3"
            class="road"
            d="M 750 450
                L 750 410
                Q 750 400 700 400
                L 50 350"
          />
          <path
            id="edge-2-4"
            class="road"
            d="M 50 350
            Q 50 280 150 280"
          />
          <path
            id="edge-4-5"
            class="road"
            d="M 150 280
            Q 150 50 450 40"
          />
          <line id="edge-5-6" class="road" x1="450" y1="40" x2="600" y2="100" />
          <line
            id="edge-6-7"
            class="road"
            x1="600"
            y1="100"
            x2="650"
            y2="200"
          />
          <line
            id="edge-7-2"
            class="road"
            x1="650"
            y1="200"
            x2="750"
            y2="450"
          />
        </g>

        <!-- Road distance labels -->
        <g id="distances" class="road-label">
          <text x="200" y="440">50 m</text>
          <text x="575" y="440">50 m</text>
          <text x="80" y="410">10 m</text>
          <text x="200" y="355">100 m</text>
          <text x="575" y="380">200 m</text>
          <text x="100" y="310">20 m</text>
          <text x="200" y="100">200 m</text>
          <text x="560" y="60">50 m</text>
          <text x="720" y="300">100 m</text>
        </g>

        <!-- Vertices / Locations -->
        <g id="locations">
          <circle id="node-main-gate" class="node" cx="400" cy="450" r="15" />
          <circle id="node-gate-2" class="node" cx="50" cy="450" r="15" />
          <circle id="node-gate-3" class="node" cx="750" cy="450" r="15" />
          <circle id="node-bus-stand" class="node" cx="50" cy="350" r="15" />
          <circle id="node-ground-1" class="node" cx="150" cy="280" r="15" />
          <circle id="node-ground-2" class="node" cx="450" cy="40" r="15" />
          <circle id="node-garden" class="node" cx="600" cy="100" r="15" />
          <circle id="node-cafeteria" class="node" cx="650" cy="200" r="15" />
          <circle id="node-parking" class="node" cx="650" cy="300" r="15" />
        </g>

        <!-- Location names -->
        <g class="node-label">
          <text x="400" y="480">Main Gate</text>
          <text x="50" y="480">Gate 2</text>
          <text x="750" y="480">Gate 3</text>
          <text x="50" y="380" class="rotate">Bus stand</text>
          <text x="150" y="320" class="rotate">Ground 1</text>
          <text x="450" y="70">Ground 2</text>
          <text x="600" y="130">Garden</text>
          <text x="650" y="230">Cafeteria</text>
          <text x="650" y="330">Parking</text>
        </g>
      </svg>
    </div>

    <script src="script.js"></script>
  </body>
</html>

<!-- 
=====> Nodes coordinate : <=====
Main gate : n0 (coordinate : x="400" y="450")
Gate 2 : n1 (coordinate : x="50" y="450")
Gate 3 : n2 (coordinate : x="750" y="450")
Bus stand : n3 (coordinate : x="50" y="350")
Garden : n4 (coordinate : x="600" y="100")
Cafeteria : n5 (coordinate : x="650" y="200")
Parking : n6 (coordinate : x="650" y="300")


250 (প্রথমটি)	Control point-এর X-coordinate (cx)
250 (দ্বিতীয়টি)	Control point-এর Y-coordinate (cy)

220 (চতুর্থটি)	Curve যেখানে শেষ হবে, তার Y-coordinate

            class="road"
            d="M 50 450
            Q 50 50 550 250"
