<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Vu Navigation</title>
  </head>

  <body>
    <h2>Varandra Campus Map</h2>
    <div class="map-container">
      <svg viewBox="0 0 800 500">
        <!-- Roads / Edges -->
        <g id="roads">
          <!-- Main gate to gate 2 -->
          <line id="edge-0-1" class="road" x1="50" y1="450" x2="400" y2="450" />
          <line
            id="edge-0-2"
            class="road"
            x1="400"
            y1="450"
            x2="750"
            y2="450"
          />
          <line id="edge-1-3" class="road" x1="50" y1="350" x2="50" y2="450" />
          <path
            id="edge-0-3"
            class="road"
            d="M 400 450
                L 400 400
                Q 400 380 380 380
                L 50 350"
          />
          <path
            id="edge-2-3"
            class="road"
            d="M 750 450
                L 750 410
                Q 750 410 750 380
                L 50 350"
          />
        </g>

        <!-- Road distance labels -->
        <g id="distances" class="road-label">
          <text x="200" y="440">50 m</text>
          <text x="575" y="440">100 m</text>
          <text x="80" y="410">100 m</text>
          <text x="200" y="355">200 m</text>
        </g>

        <!-- Vertices / Locations -->
        <g id="locations">
          <circle id="node-main-gate" class="node" cx="400" cy="450" r="15" />
          <circle id="node-gate-2" class="node" cx="50" cy="450" r="15" />
          <circle id="node-gate-3" class="node" cx="750" cy="450" r="15" />
          <circle id="node-bus-stand" class="node" cx="50" cy="350" r="15" />
        </g>

        <!-- Location names -->
        <g class="node-label">
          <text x="400" y="480">Main Gate</text>
          <text x="50" y="480">Gate 2</text>
          <text x="750" y="480">Gate 3</text>
          <text x="50" y="380" class="rotate">Bus stand</text>
        </g>
      </svg>
    </div>

    <script src="script.js"></script>
  </body>
</html>

<!-- 
Note:
Main gate : 0
Gate 2 : 1
Gate 3 : 2
Bus stand : 3
-->
