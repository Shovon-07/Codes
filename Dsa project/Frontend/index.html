<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link rel="shortcut icon" href="./img/Vu logo.jpg" type="image/x-icon" />
    <title>Vu Navigation</title>
  </head>

  <body>
    <header>
      <img src="./img/Vu logo.jpg" alt="" />
      <h2>Varendra Campus Map</h2>
    </header>

    <div class="container">
      <section class="controlPanel">
        <div class="selector">
          <select name="" id="source">
            <option value="-1">Select destination</option>
          </select>

          <select name="" id="destination">
            <option value="-1">Select destination</option>
          </select>
          <div>
            <button onclick="findPath()">Find path</button>
          </div>
        </div>
        <div class="searchBar">
          <div>
            <input type="Search location" />
            <span>Go</span>
          </div>
        </div>
      </section>

      <div class="map-container">
        <svg viewBox="0 0 800 500">
          <!-- Roads / Edges -->
          <g id="roads">
            <!-- Main gate to gate 2 -->
            <line
              id="edge-0-1"
              class="road"
              x1="50"
              y1="450"
              x2="400"
              y2="450"
            />
            <line
              id="edge-0-2"
              class="road"
              x1="400"
              y1="450"
              x2="750"
              y2="450"
            />
            <line
              id="edge-1-3"
              class="road"
              x1="50"
              y1="350"
              x2="50"
              y2="450"
            />
            <path
              id="edge-0-3"
              class="road"
              d="M 400 450
                L 400 400
                Q 400 380 380 380
                L 50 350"
            />
            <path
              id="edge-2-3"
              class="road"
              d="M 750 450
                L 750 410
                Q 750 400 700 400
                L 50 350"
            />
            <path
              id="edge-3-4"
              class="road"
              d="M 50 350
            Q 50 280 150 280"
            />
            <path
              id="edge-5-9"
              class="road"
              d="M 200 150
            Q 250 40 450 40"
            />
            <line
              id="edge-5-6"
              class="road"
              x1="450"
              y1="40"
              x2="600"
              y2="100"
            />
            <line
              id="edge-6-7"
              class="road"
              x1="600"
              y1="100"
              x2="650"
              y2="200"
            />
            <line
              id="edge-2-7"
              class="road"
              x1="650"
              y1="200"
              x2="750"
              y2="450"
            />
            <polyline
              id="edge-0-8"
              class="road"
              points="400,450 450,360 650,360 650,300"
            />
            <line
              id="edge-4-9"
              class="road"
              x1="150"
              y1="280"
              x2="200"
              y2="150"
            />
          </g>

          <!-- Road distance labels -->
          <g id="distances" class="road-label">
            <text x="200" y="440">50 m</text>
            <text x="575" y="440">50 m</text>
            <text x="80" y="410">10 m</text>
            <text x="200" y="355">150 m</text>
            <text x="575" y="380">300 m</text>
            <text x="100" y="310">20 m</text>
            <text x="280" y="60">100 m</text>
            <text x="560" y="70">50 m</text>
            <text x="720" y="300">150 m</text>
            <text x="550" y="355">130 m</text>
            <text x="200" y="230">30 m</text>
            <text x="650" y="160">10 m</text>
          </g>

          <!-- Vertices / Locations -->
          <g id="locations">
            <circle id="node-main-gate" class="node" cx="400" cy="450" r="15" />
            <circle id="node-gate-2" class="node" cx="50" cy="450" r="15" />
            <circle id="node-gate-3" class="node" cx="750" cy="450" r="15" />
            <circle id="node-bus-stand" class="node" cx="50" cy="350" r="15" />
            <circle id="node-ground-1" class="node" cx="150" cy="280" r="15" />
            <circle id="node-ground-2" class="node" cx="450" cy="40" r="15" />
            <circle id="node-garden" class="node" cx="600" cy="100" r="15" />
            <circle id="node-cafeteria" class="node" cx="650" cy="200" r="15" />
            <circle id="node-parking" class="node" cx="650" cy="300" r="15" />
            <circle
              id="node-flower-garder"
              class="node"
              cx="200"
              cy="150"
              r="15"
            />
          </g>

          <!-- Location names -->
          <g class="node-label">
            <text x="400" y="480">Main Gate</text>
            <text x="50" y="480">Gate 2</text>
            <text x="750" y="480">Gate 3</text>
            <text x="50" y="380" class="rotate">Bus stand</text>
            <text x="150" y="320" class="rotate">Ground 1</text>
            <text x="450" y="70">Ground 2</text>
            <text x="655" y="120">Bota. Garden</text>
            <text x="690" y="220">Cafeteria</text>
            <text x="650" y="330">Parking</text>
            <text x="200" y="200" class="rotate">Flower garden</text>
          </g>
        </svg>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>

<!-- 
=====> Nodes coordinate : <=====
Main gate : n0 (coordinate : x="400" y="450")
Gate 2 : n1 (coordinate : x="50" y="450")
Gate 3 : n2 (coordinate : x="750" y="450")
Bus stand : n3 (coordinate : x="50" y="350")
Ground 1 : n4 (coordinate : x="150" y="280")
Ground 2 : n5 (coordinate : x="450" y="40")
Garden : n6 (coordinate : x="600" y="100")
Cafeteria : n7 (coordinate : x="650" y="200")
Parking : n8 (coordinate : x="650" y="300")
Flower garden : n9 (coordinate : x="200" y="150")


250 (প্রথমটি)	Control point-এর X-coordinate (cx)
250 (দ্বিতীয়টি)	Control point-এর Y-coordinate (cy)

220 (চতুর্থটি)	Curve যেখানে শেষ হবে, তার Y-coordinate

            id="edge-0-4"
            class="road"
            d="M 50 450
            Q 50 50 550 250"
          />

          download completed : 4
