<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/header.css" />
    <link rel="stylesheet" href="./css/map.css" />
    <link rel="stylesheet" href="./css/controlPanel.css" />
    <link rel="stylesheet" href="./css/wishList.css" />
    <link rel="stylesheet" href="./css/scrollbar.css" />
    <link rel="shortcut icon" href="./img/Vu logo.jpg" type="image/x-icon" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <title>Vu Navigation</title>
  </head>

  <body class="custom-scrollbar">
    <header>
      <img src="./img/Vu logo.jpg" alt="Logo" />
      <h2>Varendra Campus Map</h2>
    </header>

    <div class="container">
      <section class="controlPanel">
        <div class="selector">
          <select id="source">
            <option value="-1">Source</option>
          </select>

          <select id="destination">
            <option value="-1">Destination</option>
          </select>
          <div>
            <button onclick="findPath()">Find path</button>
          </div>
        </div>
      </section>

      <section class="mapSection">
        <div class="map-container">
          <div class="map-controls">
            <button id="zoomIn" aria-label="Zoom in">+</button>
            <button id="zoomOut" aria-label="Zoom out">−</button>
            <button id="resetMap" aria-label="Reset map">⌂</button>
          </div>
          <svg
            id="campusMap"
            viewBox="0 0 1020 730"
            xmlns="http://www.w3.org/2000/svg"
          >
            <defs>
              <!-- Default Road Arrow -->
              <marker
                id="arrow"
                viewBox="0 0 10 10"
                refX="7"
                refY="5"
                markerWidth="5.5"
                markerHeight="5.5"
                orient="auto-start-reverse"
              >
                <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b" />
              </marker>
              <!-- Active Shortest Path Arrow -->
              <marker
                id="arrow-active"
                viewBox="0 0 10 10"
                refX="7"
                refY="5"
                markerWidth="5.5"
                markerHeight="5.5"
                orient="auto-start-reverse"
              >
                <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#16a34a" />
              </marker>
            </defs>

            <g id="mapContent">
              <!-- Academic Building Complex (Exact Sketch Geometry) -->
              <g id="buildings">
                <path
                  d="M 185 175 L 835 175 L 835 465 L 470 465 L 470 365 L 185 365 Z"
                  fill="#f8fafc"
                  stroke="#475569"
                  stroke-width="2.5"
                />
                <!-- Central Tree Circle (Left Courtyard) -->
                <circle
                  cx="340"
                  cy="455"
                  r="42"
                  fill="#dcfce7"
                  stroke="#16a34a"
                  stroke-width="2"
                />
                <text
                  x="340"
                  y="459"
                  font-size="13"
                  font-weight="bold"
                  fill="#15803d"
                  text-anchor="middle"
                >
                  Tree
                </text>
              </g>

              <!-- Roads & Directed Pathways (Matching Hand-Drawn Arrows) -->
              <g id="roads">
                <!-- Bottom Horizontal Main Road -->
                <line id="edge-0-1" class="road" x1="370" y1="675" x2="65" y2="675" marker-end="url(#arrow)" />
                <line id="edge-0-2" class="road" x1="370" y1="675" x2="945" y2="675" marker-end="url(#arrow)" />

                <!-- Left & Top Outer Perimeter -->
                <path id="edge-1-3" class="road" d="M 65 675 Q 40 480 40 310" marker-end="url(#arrow)" />
                <path id="edge-3-34" class="road" d="M 40 310 Q 42 220 75 160" marker-end="url(#arrow)" />
                <path id="edge-34-4" class="road" d="M 75 160 Q 135 75 280 55" marker-end="url(#arrow)" />
                <path id="edge-4-5" class="road" d="M 280 55 Q 600 42 910 60" marker-end="url(#arrow)" />

                <!-- Right Outer Perimeter -->
                <path id="edge-2-7" class="road" d="M 945 675 Q 962 520 960 375" marker-end="url(#arrow)" />
                <path id="edge-7-6" class="road" d="M 960 375 Q 968 250 960 135" marker-end="url(#arrow)" />
                <path id="edge-6-35" class="road" d="M 960 135 Q 952 110 925 95" marker-end="url(#arrow)" />
                <path id="edge-35-5" class="road" d="M 925 95 Q 920 75 910 60" marker-end="url(#arrow)" />

                <!-- Top-Right Wing -->
                <path id="edge-36-20" class="road" d="M 490 325 Q 545 310 565 215" marker-end="url(#arrow)" />
                <path id="edge-20-21" class="road" d="M 565 215 Q 640 225 715 205" marker-end="url(#arrow)" />
                <path id="edge-36-22" class="road" d="M 490 325 Q 555 315 590 270" marker-end="url(#arrow)" />

                <line id="edge-25-27" class="road" x1="660" y1="415" x2="740" y2="385" marker-end="url(#arrow)" />

                <line id="edge-21-26" class="road" x1="715" y1="205" x2="740" y2="310" marker-end="url(#arrow)" />

                <line id="edge-27-38" class="road" x1="740" y1="385" x2="755" y2="420" marker-end="url(#arrow)" />
                <line id="edge-38-28" class="road" x1="755" y1="420" x2="770" y2="450" marker-end="url(#arrow)" />

                <path id="edge-25-29" class="road" d="M 660 415 L 680 515" marker-end="url(#arrow)" />
                <line id="edge-29-30" class="road" x1="680" y1="515" x2="715" y2="515" marker-end="url(#arrow)" />
                <path id="edge-30-38" class="road" d="M 715 515 L 705 425 L 755 420" marker-end="url(#arrow)" />
                <line id="edge-8-37" class="road" x1="490" y1="430" x2="540" y2="545" marker-end="url(#arrow)" />
                <path id="edge-37-29" class="road" d="M 540 545 Q 615 545 680 515" marker-end="url(#arrow)" />

                <line id="edge-21-31" class="road" x1="715" y1="205" x2="835" y2="245" marker-end="url(#arrow)" />
                <path id="edge-31-35" class="road" d="M 835 245 Q 890 175 925 95" marker-end="url(#arrow)" />
                <line id="edge-38-32" class="road" x1="755" y1="420" x2="835" y2="420" marker-end="url(#arrow)" />
                <path id="edge-32-7" class="road" d="M 835 420 Q 900 420 960 375" marker-end="url(#arrow)" />
              </g>

              <!-- Estimated Distance Labels Next to Roads -->
              <g class="road-distance">

              <!-- Vertices / Nodes (0 to 38) -->

                <!-- Main Locations (0 to 32) -->
                <circle id="node-main-gate" class="node" cx="370" cy="675" r="8.5" />
                <circle id="node-gate-2" class="node" cx="65" cy="675" r="8.5" />
                <circle id="node-gate-3" class="node" cx="945" cy="675" r="8.5" />

          <div class="distanceMonitor"><h3 id="distanceMonitor">0 m</h3></div>
        </div>
        <div class="searchSection">
          <div>
            <input
              type="text"
              id="searchInput"
              placeholder="Search location"
            />
          </div>
          <ol id="searchList"></ol>
        </div>

      <section class="wishList">
        <div class="list">
          <button><i class="fa-regular fa-heart"></i>Favorites +</button>
          <button><i class="fa-regular fa-bookmark"></i>Saved places +</button>
          <button><i class="fa-regular fa-flag"></i>Want to go +</button>
        </div>
        <div class="places">
          <div class="list-selector">
            <h3 class="selected">
              <i class="fa-regular fa-heart"></i>Favorites
            </h3>
            <h3><i class="fa-regular fa-bookmark"></i>Saved</h3>
            <h3><i class="fa-regular fa-flag"></i>Want to go</h3>

          <ol>
            <li>Main Gate -> CSE Faculty</li>
            <li>Gate 2 -> Library (b)</li>
