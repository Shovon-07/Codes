<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Vu Navigation</title>
  </head>

  <body>
    <h2>University Campus Map</h2>
    <div class="map-container">
      <svg viewBox="0 0 800 500">
        <!-- Roads / Edges -->
        <g id="roads">
          <line
            id="edge-0-1"
            class="road"
            x1="100"
            y1="250"
            x2="300"
            y2="250"
          />
          <line
            id="edge-0-2"
            class="road"
            x1="100"
            y1="250"
            x2="300"
            y2="400"
          />
          <line
            id="edge-1-3"
            class="road"
            x1="300"
            y1="250"
            x2="550"
            y2="250"
          />
          <line
            id="edge-2-3"
            class="road"
            x1="300"
            y1="400"
            x2="550"
            y2="250"
          />
          <line
            id="edge-1-4"
            class="road"
            x1="300"
            y1="250"
            x2="550"
            y2="100"
          />
          <line
            id="edge-4-3"
            class="road"
            x1="550"
            y1="100"
            x2="550"
            y2="250"
          />
          <line
            id="edge-0-4"
            class="road"
            x1="100"
            y1="250"
            x2="550"
            y2="100"
          />
        </g>

        <!-- Road distance labels -->
        <g id="distances" class="road-label">
          <text x="200" y="235">4</text>
          <text x="190" y="335">2</text>
          <text x="425" y="235">3</text>
          <text x="425" y="345">5</text>
          <text x="425" y="165">4</text>
          <text x="570" y="175">2</text>
          <text x="300" y="170">20</text>
        </g>

        <!-- Vertices / Locations -->
        <g id="locations">
          <circle id="node-main-gate" class="node" cx="100" cy="250" r="15" />
          <circle id="node-library" class="node" cx="300" cy="250" r="15" />
          <circle id="node-cafeteria" class="node" cx="300" cy="400" r="15" />
          <circle id="node-cse-office" class="node" cx="550" cy="250" r="15" />
          <circle id="node-auditorium" class="node" cx="550" cy="100" r="15" />
        </g>

        <!-- Location names -->
        <g class="node-label">
          <text x="100" y="285">Main Gate</text>
          <text x="300" y="285">Library</text>
          <text x="300" y="435">Cafeteria</text>
          <text x="600" y="285">CSE Programe office</text>
          <text x="550" y="75">Auditorium</text>
        </g>
      </svg>
    </div>

    <script src="script.js"></script>
  </body>
</html>
